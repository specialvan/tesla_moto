[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: integration tests that exercise sim + r02 sim_binding wiring",
]

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.12"
mypy_path = ["."]
explicit_package_bases = true
ignore_missing_imports = false
